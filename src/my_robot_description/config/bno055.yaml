bno055:
  ros__parameters:
    connection_type: "i2c"
    i2c_bus: 1
    i2c_addr: 0x29
    frame_id: "imu_link"
    data_query_frequency: 50
    operation_mode: 0x08
    variance_acc: [0.017, 0.017, 0.017]
    variance_angular_vel: [0.0001, 0.0001, 0.0001]   # σ ≈ 0.01 rad/s
    variance_orientation: [0.001, 0.001, 0.001]      # σ ≈ 1.8°
    variance_mag: [0.0, 0.0, 0.0]